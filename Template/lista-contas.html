<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Contas</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Contas Cadastradas</h1>
    {% if contas|length == 0 %}
        <p>Nenhuma conta cadastrada.</p>
    {% else %}
        {% for conta in contas %}
            <p>
                <strong>Cliente:</strong>
                {{ conta.nome }}
            </p>
            <p>
                <strong>Conta:</strong>
                {{ conta.numero }}
            </p>
            <p>
                <strong>Saldo:</strong>
                R$ {{ "%.2f"|format(conta.saldo) }}
            </p>
            <hr>
        {% endfor %}
    {% endif %}
    <a href="/">Voltar ao menu</a>

</body>
</html>
