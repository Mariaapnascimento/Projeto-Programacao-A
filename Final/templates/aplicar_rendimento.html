<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Aplicar Rendimento</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Aplicar Rendimento</h1>
    <form method="POST">
        <label>Número da conta poupança:</label>
        <input type="number" name="numero" required>
        <br><br>
        <button type="submit">Aplicar Rendimento</button>
    </form>
    {% if mensagem %}
        <p>{{ mensagem }}</p>
    {% endif %}
    <br>
    <a href="/">Voltar ao menu</a>
</body>
</html>
