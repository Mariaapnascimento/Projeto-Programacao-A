<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Dados JSON</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Dados Armazenados em JSON</h1>
        {% if mensagem %}
            <p>{{ mensagem }}</p>
        {% else %}
            <pre>{{ dados }}</pre>
        {% endif %}
        <a href="{{ url_for('inicio') }}">
            <button>Voltar ao menu</button>
        </a>
    </div>
</body>
</html>
