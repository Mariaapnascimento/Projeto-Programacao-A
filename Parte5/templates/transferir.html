<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Transferir</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Realizar Transferência</h1>
    <form method="POST">
        <label>Número da conta de origem:</label>
        <input type="number" name="numero_origem" required>
        <br><br>
        <label>Número da conta de destino:</label>
        <input type="number" name="numero_destino" required>
        <br><br>
        <label>Valor da transferência:</label>
        <input type="number" name="valor" step="0.01" min="0.01" required>
        <br><br>
        <button type="submit">
            Transferir
        </button>
    </form>
    {% if mensagem %}
        <p>{{ mensagem }}</p>
    {% endif %}
    <br>
    <a href="/">Voltar ao menu</a>

</body>
</html>
