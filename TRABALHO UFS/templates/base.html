<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Banco</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a href="{{ url_for('index') }}">BANCO</a>
  </header>

  <main>
    {% if request.args.get("msg") %}
      <div class="msg {{ 'sucesso' if request.args.get('tipo') == 'sucesso' else 'erro' }}">
        {{ request.args.get("msg") }}
      </div>
    {% endif %}

    {% block conteudo %}{% endblock %}
  </main>
</body>
</html>
